html[data-theme="dark"]{
  --bg:#131315; --panel:#18181b; --surface:#1d1d21; --line:#2a2a30; --line2:#36363d;
  --text:#ebe9e4; --muted:#96939b; --faint:#6c6a72;
  --accent:color-mix(in srgb,var(--accent-base) 70%,#fff); --accent-ink:#15151a;
  --accent-soft:color-mix(in srgb,var(--accent-base) 24%,#1d1d21); --accent-text:color-mix(in srgb,var(--accent-base) 52%,#fff);
  --mark:#5b4e12; --danger:#ef6b6b; --code-bg:#17171b; --shadow:0 10px 30px rgba(0,0,0,.45);
  --tag-bg:color-mix(in srgb,var(--accent-base) 22%,#1d1d21); --tag-text:var(--accent-text);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:250px 330px 1fr;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

/* ---------- sidebar ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:18px 18px 10px;font-weight:700;letter-spacing:-.01em;font-size:16px}
.brand .logo{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 210deg,var(--accent),#c86bd8,var(--accent));position:relative}
.brand .logo::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel)}
.side-actions{padding:6px 14px 10px;display:flex;flex-direction:column;gap:8px}
.btn-new{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:9px 12px;font-weight:600}
.btn-new:hover{filter:brightness(1.06)}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 10px}
.search input{border:0;outline:0;background:transparent;padding:8px 0;width:100%}
.search svg{flex:none;color:var(--faint)}
.nav{flex:1;overflow:auto;padding:4px 8px 12px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:8px;color:var(--text);text-align:left;min-height:32px}
.nav-item:hover{background:rgba(127,120,110,.10)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav-item .ic{width:18px;display:inline-flex;justify-content:center;color:var(--muted);flex:none}
.nav-item.active .ic{color:var(--accent-text)}
.nav-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .ct{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav-item .more{opacity:0;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.nav-item:hover .more,.nav-item.active .more{opacity:1}
.nav-item .more:hover{background:rgba(127,120,110,.18)}
.caret{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);flex:none;transition:transform .15s}
.caret.open{transform:rotate(90deg)}
.caret.nokids{visibility:hidden}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 4px;font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.04em}
.sec button{width:22px;height:22px;border-radius:6px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.sec button:hover{background:rgba(127,120,110,.15)}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.foot-row{display:flex;gap:6px}
.chip-btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.chip-btn:hover{border-color:var(--line2)}
.store-note{display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.dot{width:7px;height:7px;border-radius:50%;background:#3fae6a;margin-top:5px;flex:none}
.dot.warn{background:#e0a030}

/* ---------- list ---------- */
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.list-head{display:flex;align-items:center;gap:8px;padding:16px 16px 10px}
.list-head h2{font-size:18px;margin:0;flex:1;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.icon-btn:hover{background:rgba(127,120,110,.12);color:var(--text)}
.icon-btn.on{color:var(--accent-text)}
.list-sub{display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px;font-size:12px;color:var(--faint)}
.list-sub select{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer}
.trash-bar{margin:0 12px 8px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.notes{flex:1;overflow:auto;padding:0 10px 90px}
.card{display:flex;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid transparent;margin-bottom:3px}
.card:hover{background:var(--surface)}
.card.active{background:var(--surface);border-color:var(--line2);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.card .c-main{flex:1;min-width:0}
.card .c-title{font-weight:600;font-size:14.5px;display:flex;gap:6px;align-items:center}
.card .c-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .c-title .pin{color:var(--accent-text);flex:none}
.card .c-snip{color:var(--muted);font-size:13px;line-height:1.45;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.card .c-meta{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:11.5px;color:var(--faint);flex-wrap:wrap}
.card .c-meta .t{color:var(--tag-text);background:var(--tag-bg);border-radius:5px;padding:0 6px}
.card .c-thumb{width:54px;height:54px;border-radius:9px;background:var(--panel) center/cover no-repeat;flex:none;border:1px solid var(--line)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:50px 20px;text-align:center;color:var(--faint);font-size:13.5px;line-height:1.7}

/* ---------- editor ---------- */
.editor{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface)}
.ed-head{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:56px}
.ed-head .back{display:none}
.nb-select{max-width:190px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--muted);cursor:pointer}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;margin-left:auto}
.seg button{padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
html[data-theme="dark"] .seg button.on{background:var(--line2)}
.ed-scroll{flex:1;overflow:auto;min-height:0}
.ed-inner{max-width:820px;margin:0 auto;padding:22px 28px 60px}
.ed-split .ed-inner{max-width:none}
.title-in{width:100%;border:0;outline:0;background:transparent;font-family:var(--md-font);font-size:27px;font-weight:700;letter-spacing:-.02em;padding:4px 0 8px}
.title-in::placeholder{color:var(--faint)}
.toolbar{position:sticky;top:0;z-index:3;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--surface);padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.toolbar::-webkit-scrollbar{display:none}
.toolbar button{min-width:32px;height:32px;padding:0 7px;border-radius:7px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
.toolbar button:hover{background:var(--bg);color:var(--text)}
.toolbar .sep{width:1px;background:var(--line);margin:6px 4px;flex:none}
#seg button{white-space:nowrap}
@media (max-width:560px){#seg button{padding-left:8px;padding-right:8px;font-size:12.5px}.ed-head .nb-select{max-width:84px}}
.live{min-height:38vh}
.live .cm-editor{outline:0;background:transparent;font-family:var(--md-font);font-size:var(--md-size);line-height:1.75;color:var(--text)}
.live .cm-editor.cm-focused{outline:0}
.live .cm-content{padding:0;caret-color:var(--accent);min-height:38vh}
.live .cm-line{padding:0}
.live .cm-scroller{overflow:visible;font-family:inherit;line-height:inherit}
.live .cm-cursor{border-left:2px solid var(--accent)}
.live .cm-selectionBackground,.live .cm-focused .cm-selectionBackground{background:var(--accent-soft)!important}
.live .cm-placeholder{color:var(--faint)}
.live .cm-h{font-weight:700;letter-spacing:-.02em;line-height:1.4}
.live .cm-h1{font-size:1.6em;padding-top:.5em!important}.live .cm-h2{font-size:1.32em;padding-top:.4em!important}.live .cm-h3{font-size:1.12em;padding-top:.3em!important}
.live .cm-strong{font-weight:700}.live .cm-em{font-style:italic}.live .cm-strike{text-decoration:line-through;color:var(--muted)}
.live .cm-hl{background:color-mix(in srgb,#ffd84a 45%,transparent);border-radius:3px}
.live .cm-icode{font-family:var(--mono);font-size:.86em;background:var(--code-bg);border:1px solid var(--line);border-radius:5px;padding:1px 4px}
.live .cm-cb{font-family:var(--mono);font-size:13px;background:var(--code-bg);padding:0 14px!important;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.live .cm-cb-first{border-top:1px solid var(--line);border-radius:10px 10px 0 0;padding-top:6px!important}
.live .cm-cb-last{border-bottom:1px solid var(--line);border-radius:0 0 10px 10px;padding-bottom:6px!important}
.live .cm-cb-fence{color:var(--faint)}
.live .cm-quote{border-left:3px solid var(--accent);padding-left:14px!important;color:var(--muted);background:var(--bg)}
.live .cm-wiki{color:var(--accent-text);font-weight:500;border-bottom:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.live .cm-wiki.cm-r,.live .cm-tag.cm-r,.live .cm-link.cm-r{cursor:pointer}
.live .cm-wiki.cm-r:hover{background:var(--accent-soft)}
.live .cm-tag{background:var(--tag-bg);color:var(--tag-text);border-radius:5px;padding:1px 5px;font-size:.92em}
.live .cm-link{color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}
.live .cm-bullet{display:inline-block;width:1em;color:var(--accent);font-weight:700}
.live .cm-check{width:16px;height:16px;margin:0 6px 0 0;vertical-align:-2px;accent-color:var(--accent);cursor:pointer}
.live .cm-done{color:var(--faint);text-decoration:line-through}
.live .cm-hr{display:inline-block;width:100%;height:1px;background:var(--line2);vertical-align:middle}
.live .cm-img{display:block;margin:.5em 0}
.live .cm-img img{max-width:100%;max-height:70vh;border-radius:10px;border:1px solid var(--line);display:block;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.live .cm-img.sel img{outline:3px solid var(--accent);outline-offset:2px}
.live .cm-img.drag img{opacity:.4}
.cm-dropbar{position:fixed;height:3px;background:var(--accent);border-radius:2px;z-index:999;pointer-events:none}
body.cm-dragging,body.cm-dragging *{cursor:grabbing!important;user-select:none}
.live .cm-img img:not([src]){min-height:80px;min-width:120px;background:var(--bg)}
.live .cm-img.bad{color:var(--faint);font-size:13px}
.img-strip{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;margin-top:6px;border-top:1px dashed var(--line,#ddd)}
.img-strip .th{flex:0 0 auto;width:92px;height:92px;border-radius:8px;overflow:hidden;border:1px solid var(--line,#ddd);background:var(--bg2,#f3f3f3);cursor:pointer;position:relative;padding:0}
.img-strip .th img{width:100%;height:100%;object-fit:cover;display:block}
.img-strip .th:hover{outline:2px solid var(--accent,#5b57d6)}
.img-strip .cap{flex:0 0 100%;font-size:12px;color:var(--faint,#888);order:-1}
.panes{display:grid;grid-template-columns:1fr;gap:28px}
.ed-split .panes{grid-template-columns:1fr 1fr}
.src{width:100%;min-height:38vh;border:0;outline:0;resize:none;background:transparent;font-family:var(--ed-font);font-size:var(--ed-size);line-height:1.75;tab-size:2;overflow:hidden}
.ed-split .src{border-right:1px dashed var(--line);padding-right:20px}
.ed-foot{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);min-height:38px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.ed-foot .tags{display:flex;gap:5px;flex:1;overflow:hidden;flex-wrap:nowrap}
.ed-foot .tags a{color:var(--tag-text);background:var(--tag-bg);border-radius:5px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.trash-banner{margin:14px 28px 0;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.trash-banner .sp{flex:1}
.ed-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--faint);font-size:14px}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}

/* ---------- rendered markdown ---------- */
.md{line-height:1.75;font-size:var(--md-size);font-family:var(--md-font);word-wrap:break-word}
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3{letter-spacing:-.02em;line-height:1.35;margin:1.4em 0 .5em}
.md h1{font-size:1.6em}.md h2{font-size:1.32em}.md h3{font-size:1.12em}
.md p{margin:.55em 0}
.md a{color:var(--accent-text)}
.md a.tag{text-decoration:none;background:var(--tag-bg);color:var(--tag-text);border-radius:5px;padding:1px 6px;font-size:.92em;cursor:pointer}
.md ul,.md ol{padding-left:1.4em;margin:.5em 0}
.md li{margin:.15em 0}
.md li:has(>input[type=checkbox]){list-style:none;margin-left:-1.3em}
.md li>input[type=checkbox]{width:16px;height:16px;margin:0 8px 0 0;vertical-align:-3px;accent-color:var(--accent);cursor:pointer}
.md li.done{color:var(--faint);text-decoration:line-through}
.md blockquote{margin:.8em 0;padding:.2em 1em;border-left:3px solid var(--accent);color:var(--muted);background:var(--bg);border-radius:0 8px 8px 0}
.md code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.md pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;line-height:1.6}
.md pre code{border:0;padding:0;background:none;font-size:13px}
.md table{border-collapse:collapse;margin:.8em 0;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line2);padding:6px 11px}
.md th{background:var(--bg)}
.md hr{border:0;border-top:1px solid var(--line2);margin:1.6em 0}
.md img{max-width:100%;border-radius:10px;display:block;margin:.6em 0;border:1px solid var(--line)}
.md img:not([src]){min-height:80px;background:var(--bg)}
.hljs-keyword,.hljs-selector-tag,.hljs-built_in{color:#8b5cf6}.hljs-string,.hljs-attr{color:#0f8a5f}
.hljs-comment,.hljs-quote{color:var(--faint);font-style:italic}.hljs-number,.hljs-literal{color:#c2410c}
.hljs-title,.hljs-section{color:#2563eb}.hljs-type,.hljs-class{color:#b45309}.hljs-meta{color:var(--muted)}
html[data-theme="dark"] .hljs-keyword,html[data-theme="dark"] .hljs-built_in{color:#c4a7ff}
html[data-theme="dark"] .hljs-string,html[data-theme="dark"] .hljs-attr{color:#6ee7b7}
html[data-theme="dark"] .hljs-number,html[data-theme="dark"] .hljs-literal{color:#fdba74}
html[data-theme="dark"] .hljs-title,html[data-theme="dark"] .hljs-section{color:#93c5fd}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,15,.35);z-index:40}
.modal{position:fixed;inset:0;background:rgba(10,10,15,.38);display:flex;align-items:flex-start;justify-content:center;padding:14vh 16px 16px;z-index:60}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(420px,100%);padding:18px}
.dlg h3{margin:0 0 6px;font-size:16px}
.dlg p{margin:0 0 12px;color:var(--muted);font-size:13.5px;line-height:1.6}
.dlg-in,.qs-in{width:100%;border:1px solid var(--line2);background:var(--bg);border-radius:9px;padding:9px 11px;outline:0;margin:6px 0 14px}
.dlg-in:focus,.qs-in:focus{border-color:var(--accent)}
.dlg-btns{display:flex;justify-content:flex-end;gap:8px}
.dlg-btns button{padding:8px 14px;border-radius:9px;border:1px solid var(--line2);font-size:13.5px}
.dlg-btns .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.dlg-btns .danger{background:var(--danger);color:#fff;border-color:var(--danger);font-weight:600}
.qs{width:min(560px,100%);padding:12px}
.qs-in{margin:0 0 8px;font-size:15px}
.qs-list{max-height:50vh;overflow:auto}
.qs-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px}
.qs-item.sel{background:var(--accent-soft);color:var(--accent-text)}
.qs-item small{margin-left:auto;color:var(--faint);font-size:11.5px}
.qs-hint{display:flex;gap:12px;padding:8px 6px 2px;font-size:11.5px;color:var(--faint)}
.menu{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:5px;min-width:170px}
.menu button{display:flex;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:13.5px}
.menu button:hover{background:var(--bg)}
.menu button.danger{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:11px;font-size:13.5px;display:flex;gap:14px;align-items:center;z-index:80;box-shadow:var(--shadow)}
.toast button{color:var(--accent-soft);font-weight:700}
html[data-theme="dark"] .toast button{color:var(--accent-ink)}
.fab{display:none;position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(70,60,200,.35);align-items:center;justify-content:center;z-index:20}
.drop-hint{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:16px;background:rgba(91,87,214,.08);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--accent-text);z-index:90;pointer-events:none}

/* ---------- links ---------- */
.md a.wikilink{color:var(--accent-text);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 45%,transparent);cursor:pointer;font-weight:500}
.md a.wikilink:hover{background:var(--accent-soft)}
.md a.wikilink.missing{color:var(--muted);border-bottom-style:dashed;font-weight:400}
.ac{position:fixed;z-index:75;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:5px;min-width:220px;max-width:320px;max-height:260px;overflow:auto}
.ac button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:7px 9px;border-radius:7px;font-size:13.5px}
.ac button.sel{background:var(--accent-soft);color:var(--accent-text)}
.ac button small{margin-left:auto;color:var(--faint);font-size:11px;white-space:nowrap}
.ac .ac-h{font-size:11px;color:var(--faint);padding:4px 9px 3px}

/* ---------- connections ---------- */
.conn{margin-top:42px;border-top:1px solid var(--line);padding-top:18px}
.conn-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.lg-box{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.lg-top{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.lg-top .sp{flex:1}
.seg.small{margin:0;padding:1px;border-radius:7px}
.seg.small button{padding:2px 8px;font-size:11.5px;border-radius:6px}
.lg-wrap{height:270px;position:relative}
.lg-wrap canvas,.graph-wrap canvas{display:block;touch-action:none;position:absolute;left:0;top:0}
.bl h5{margin:4px 0 8px;font-size:12.5px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.bl h5 .n{color:var(--faint);font-weight:400}
.bl-item{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:1px solid var(--line);margin-bottom:6px;background:var(--surface)}
.bl-item:hover{border-color:var(--line2)}
.bl-item b{font-size:13.5px;display:block;margin-bottom:2px}
.bl-item span{font-size:12.5px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bl-row{display:flex;gap:6px;align-items:stretch}
.bl-row .bl-item{flex:1;min-width:0}
.bl-row .chip-btn{margin-bottom:6px;white-space:nowrap}
.bl-empty{font-size:12.5px;color:var(--faint);padding:2px 2px 12px;line-height:1.6}

/* ---------- graph pane ---------- */
.graph-pane{display:none;flex-direction:column;min-height:0;min-width:0;background:var(--bg);grid-column:2/-1}
.app.graph-mode .graph-pane{display:flex}
.app.graph-mode .list,.app.graph-mode .editor,.app.graph-mode .fab{display:none!important}
.g-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.g-head h2{margin:0 6px 0 0;font-size:18px;letter-spacing:-.02em}
.g-search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 9px;min-width:160px;flex:0 1 220px}
.g-search input{border:0;outline:0;background:transparent;padding:6px 0;width:100%;font-size:13px}
.g-tog{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 9px;cursor:pointer;user-select:none}
.g-tog input{accent-color:var(--accent);margin:0}
.g-tog select{border:0;background:transparent;color:var(--text);font-size:12.5px}
.graph-wrap{flex:1;position:relative;min-height:0}
.g-legend{position:absolute;left:14px;bottom:14px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px;max-width:220px;pointer-events:none}
.g-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.g-hint{position:absolute;right:14px;bottom:14px;font-size:11.5px;color:var(--faint);pointer-events:none;text-align:right;line-height:1.6}
.lg-wrap .g-empty{align-items:flex-end;padding-bottom:18px}
.g-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13.5px;text-align:center;line-height:1.7;pointer-events:none}

/* ---------- versions ---------- */
.ver{width:min(860px,100%);padding:0;display:grid;grid-template-columns:230px 1fr;max-height:76vh;overflow:hidden}
.ver-list{border-right:1px solid var(--line);overflow:auto;padding:10px}
.ver-list h3{font-size:15px;margin:4px 6px 10px}
.ver-item{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px}
.ver-item.sel{background:var(--accent-soft);color:var(--accent-text)}
.ver-item small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
.ver-view{display:flex;flex-direction:column;min-height:0}
.ver-body{flex:1;overflow:auto;padding:18px 22px}
.ver-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.ver-foot button{padding:8px 14px;border-radius:9px;border:1px solid var(--line2);font-size:13.5px}
.ver-foot .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

/* ---------- 2차 기능 ---------- */
.notes.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;align-content:start}
.notes.grid .card{flex-direction:column;background:var(--surface);border-color:var(--line);margin:0;padding:10px}
.notes.grid .card .c-thumb{order:-1;width:100%;height:96px}
.notes.grid .card .c-snip{-webkit-line-clamp:3}
.notes.grid .empty{grid-column:1/-1}
.save-smart{color:var(--accent-text);font-size:12px;font-weight:600}
.md h1,.md h2,.md h3,.md h4{position:relative;scroll-margin-top:64px}
.md .fold{position:absolute;left:-24px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);opacity:0;transition:opacity .12s}
.md .fold svg{transform:rotate(90deg);transition:transform .15s}
.md h1:hover .fold,.md h2:hover .fold,.md h3:hover .fold,.md h4:hover .fold,.md .folded .fold{opacity:1}
.md .folded .fold svg{transform:none}
.md .folded::after{content:" …";color:var(--faint);font-weight:400}
@media (hover:none){.md .fold{opacity:.45}}
.hover-card{position:fixed;z-index:65;width:min(380px,90vw);max-height:300px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;font-size:13.5px}
.hover-card .md{font-size:13.5px;line-height:1.65}
.hover-card h4{margin:0 0 6px;font-size:15px}
.app.focus{grid-template-columns:1fr!important}
.app.focus .side,.app.focus .list{display:none!important}
.app.focus .ed-inner{max-width:760px}
.set{width:min(460px,100%)}
.set h4{margin:16px 0 8px;font-size:13px;color:var(--muted)}
.set h4:first-of-type{margin-top:6px}
.swatches{display:flex;gap:10px}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.swatches button.on{border-color:var(--text)}
.opt-row{display:flex;gap:6px;flex-wrap:wrap}
.opt-row button{border:1px solid var(--line2);border-radius:9px;padding:6px 12px;font-size:13px}
.opt-row button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.set .note{font-size:12px;color:var(--faint);line-height:1.6;margin-top:6px}
.dlg label.fl{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.qs-item .ic{width:18px;display:inline-flex;justify-content:center;color:var(--muted)}
.rel-why{font-size:11px;color:var(--faint);margin-left:4px;font-weight:400}

/* ---------- responsive ---------- */
.menu-btn{display:none}
@media (max-width:1100px){
  .app{grid-template-columns:310px 1fr}
  .graph-pane{grid-column:1/-1}
  .side{position:fixed;top:0;bottom:0;left:0;width:280px;z-index:50;transform:translateX(-102%);transition:transform .2s ease;padding-top:env(safe-area-inset-top);box-shadow:var(--shadow)}
  .app.drawer .side{transform:none}
  .menu-btn{display:inline-flex}
  .seg .split-btn{display:none}
}
@media (max-width:720px){
  .app{grid-template-columns:1fr}
  .app[data-pane="list"] .editor{display:none}
  .app[data-pane="editor"] .list{display:none}
  .ed-head .back{display:inline-flex}
  .focus-btn{display:none!important}
  .app[data-pane="list"] .fab{display:inline-flex}
  .ed-inner{padding:14px 18px 60px}
  .title-in{font-size:23px}
  .nb-select{max-width:130px}
  .nav-item .more{opacity:1}
  .conn-grid{grid-template-columns:1fr}
  .ver{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .ver-list{border-right:0;border-bottom:1px solid var(--line);max-height:30vh}
  .g-head{padding:10px 12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .g-head>*{flex:none}
  .g-search{min-width:130px;flex:0 0 140px}
  .g-hint{display:none}
}
</style>
</head>
<body>
<div class="app" id="app" data-pane="list">
  <aside class="side" id="side">
    <div class="brand"><span class="logo"></span>브레인 노트</div>
    <div class="side-actions">
      <button class="btn-new" id="newBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>새 노트</button>
      <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="searchIn" type="search" placeholder="노트 검색" autocomplete="off"></label>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="foot-row">
        <button class="chip-btn" id="themeBtn"></button>
        <button class="chip-btn" id="qsBtn" title="빠른 이동 (Ctrl K)">빠른 이동</button>
        <button class="chip-btn" id="setBtn" aria-label="설정" title="모양 · 가져오기">⚙︎</button>
      </div>
      <div class="store-note" id="storeNote"></div>
    </div>
  </aside>

  <section class="list">
    <div class="list-head">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h2 id="listTitle">모든 노트</h2>
      <button class="icon-btn" id="viewBtn" aria-label="보기 방식" title="목록/카드 보기"></button>
      <button class="icon-btn" id="listNewBtn" aria-label="새 노트"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </div>
    <div class="list-sub"><span id="listCount"></span>
      <select id="sortSel" aria-label="정렬"><option value="updated">수정한 날짜순</option><option value="created">만든 날짜순</option><option value="title">제목순</option></select>
    </div>
    <div id="trashBar"></div>
    <div class="notes" id="notes"></div>
  </section>

  <main class="editor" id="editor"></main>
  <section class="graph-pane" id="graphPane">
    <div class="g-head">
      <button class="icon-btn menu-btn" id="gMenuBtn" aria-label="메뉴"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h2>그래프</h2>
      <label class="g-search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="gSearch" type="search" placeholder="노드 찾기" autocomplete="off"></label>
      <label class="g-tog"><input type="checkbox" id="gTags">태그</label>
      <label class="g-tog"><input type="checkbox" id="gGhosts">없는 링크</label>
      <label class="g-tog"><input type="checkbox" id="gOrphans">고립 노트 숨기기</label>
      <label class="g-tog">색 <select id="gColor"><option value="tag">태그별</option><option value="notebook">노트북별</option></select></label>
      <button class="icon-btn" id="gReset" title="화면 맞추기" aria-label="화면 맞추기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="graph-wrap" id="graphWrap"><div class="g-legend" id="gLegend" hidden></div><div class="g-hint">드래그로 이동 · 휠로 확대<br>점을 누르면 노트가 열려요</div></div>
  </section>
  <button class="fab" id="fab" aria-label="빠른 메모"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="modal" id="modal" hidden></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="mdIn" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden>
<div class="hover-card" id="hoverCard" hidden></div>

<script>
"use strict";
/* =========================================================
   브레인 노트 — 1-1단계 (로컬 저장 버전)
   저장소(Store)는 교체형: 나중에 DriveStore가 같은 메서드
   (all / get / put / del)를 구현하면 그대로 꽂힘.
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pref = (k, d) => { try { const v = localStorage.getItem("bn." + k); return v === null ? d : v; } catch { return d; } };
const setPref = (k, v) => { try { localStorage.setItem("bn." + k, v); } catch {} };

/* ---------- 저장소: 이 브라우저(IndexedDB) ---------- */
const LocalStore = {
  name: "local", db: null, ok: false,
  mem: { notes: new Map(), notebooks: new Map(), images: new Map(), versions: new Map() },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("brainnote", 2);
        r.onupgradeneeded = () => {
          const d = r.result;
          for (const n of ["notes", "notebooks", "images"])
            if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: "id" });
          if (!d.objectStoreNames.contains("versions")) d.createObjectStore("versions", { keyPath: "id" }).createIndex("noteId", "noteId");
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      this.ok = true;
    } catch { this.ok = false; }
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  async all(store) {
    if (!this.ok) return [...this.mem[store].values()];
    try { const r = await this._tx(store, "readonly", s => s.getAll()); r.forEach(o => this.mem[store].set(o.id, o)); return r; } catch { return [...this.mem[store].values()]; }
  },
  async byNote(store, noteId) {
    const fb = () => [...this.mem[store].values()].filter(v => v.noteId === noteId);
    if (!this.ok) return fb();
    try { return await this._tx(store, "readonly", s => s.index("noteId").getAll(noteId)); } catch { return fb(); }
  },
  async get(store, id) { if (!this.ok) return this.mem[store].get(id); try { return await this._tx(store, "readonly", s => s.get(id)); } catch { return this.mem[store].get(id); } },
  async put(store, obj) {
    const fromSync = obj.__sync; delete obj.__sync;
    if (!fromSync && typeof syncHook === "function") syncHook(store, obj);
    this.mem[store].set(obj.id, obj); if (!this.ok) return; try { await this._tx(store, "readwrite", s => s.put(obj)); } catch { this.ok = false; renderStoreNote(); } },
  async del(store, id, fromSync) {
    if (!fromSync && typeof syncHook === "function") syncHook(store, this.mem[store].get(id) || { id }, true);
    this.mem[store].delete(id); if (!this.ok) return; try { await this._tx(store, "readwrite", s => s.delete(id)); } catch {} },
};
let Store = LocalStore;

/* ---------- 상태 ---------- */
const S = {
  notes: [], notebooks: [],
  view: { type: "all" }, current: null, search: "",
  sort: pref("sort", "updated"), mode: pref("mode", "live"), theme: pref("theme", "system"),
  open: new Set((() => { try { return JSON.parse(pref("open", "[]")); } catch { return []; } })()),
  listView: pref("listView", "list"), focus: false,
  smart: (() => { try { return JSON.parse(pref("smart", "[]")); } catch { return []; } })(),
  look: Object.assign({ accent: "#5b57d6", font: "sans", size: "m", ed: "mono" }, (() => { try { return JSON.parse(pref("look", "{}")); } catch { return {}; } })()),
};
const E = {}; // 편집기 요소

/* ---------- 태그 ---------- */
const TAG_RE = /(^|[\s(])#([\p{L}\p{N}_][\p{L}\p{N}_\-\/]*)/gu;
const outsideCode = (md, fn) => md.split(/(```[\s\S]*?(?:```|$)|`[^`\n]*`)/g).map((p, i) => (i % 2 ? p : fn(p))).join("");
function tagsOf(md) {
  const set = new Set();
  outsideCode(md, seg => { for (const m of seg.matchAll(TAG_RE)) set.add(m[2].replace(/\/+$/, "")); return seg; });
  return [...set];
}

/* ---------- [[링크]] ---------- */
const WIKI_RE = /\[\[([^\[\]\n|]+)(?:\|([^\[\]\n]+))?\]\]/g;
const keyOf = t => String(t || "").trim().toLowerCase();
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function linksOf(md) {
  const out = new Set();
  outsideCode(md, seg => { for (const m of seg.matchAll(WIKI_RE)) out.add(m[1].trim()); return seg; });
  return [...out];
}
let _tm = null, _tmRev = -1, REV = 0;
function titleMap() {
  if (_tmRev === REV && _tm) return _tm;
  _tm = new Map();
  [...S.notes].filter(n => !n.deleted && n.title.trim()).sort((a, b) => a.updated - b.updated).forEach(n => _tm.set(keyOf(n.title), n));
  _tmRev = REV; return _tm;
}
const resolve = t => titleMap().get(keyOf(t)) || null;
const attrSafe = s => esc(s).replace(/#/g, "&#35;");
// 코드 블록과 이미 걸린 [[링크]]를 뺀 부분에만 fn 적용
const outsideLinks = (md, fn) => md.split(/(```[\s\S]*?(?:```|$)|`[^`\n]*`|\[\[[^\]\n]*\]\])/g).map((p, i) => (i % 2 ? p : fn(p))).join("");

/* ---------- 마크다운 렌더 ---------- */
if (window.marked) {
  marked.use({
    gfm: true, breaks: true,
    renderer: {
      image(a, b, c) {
        const href = typeof a === "object" ? a.href : a, alt = typeof a === "object" ? a.text : c;
        const im = href && (href.match(/^img:(.+)$/) || href.match(ATT_RE));
        if (im) return `<img data-img="${esc(im[1])}" alt="${esc(alt || "")}">`;
        return `<img src="${esc(href)}" alt="${esc(alt || "")}">`;
      },
    },
  });
}
function renderMD(md) {
  const pre = outsideCode(md, seg => seg
    .replace(WIKI_RE, (m, t, alias) => `<a class="wikilink${resolve(t) ? "" : " missing"}" data-link="${attrSafe(t.trim())}">${attrSafe((alias || t).trim())}</a>`)
    .replace(/==([^=\n]+)==/g, "<mark>$1</mark>")
    .replace(TAG_RE, (m, p, t) => `${p}<a class="tag" data-tag="${esc(t)}">#${esc(t)}</a>`));
  let html = window.marked ? marked.parse(pre) : `<pre>${esc(md)}</pre>`;
  if (window.DOMPurify) html = DOMPurify.sanitize(html, { ADD_ATTR: ["data-img", "data-tag", "data-link"] });
  return html;
}
function plain(md) {
  return md.replace(/```[\s\S]*?(```|$)/g, " ").replace(WIKI_RE, (m, t, a) => (a || t)).replace(/!\[[^\]]*\]\([^)]*\)/g, " ").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/^\s*[-*+]\s+\[[ xX]\]\s*/gm, "").replace(/[#>*_`~=|-]+/g, " ").replace(/\s+/g, " ").trim();
}

/* ---------- 이미지 ---------- */
const imgURLs = new Map();
async function imgURL(id) {
  if (imgURLs.has(id)) return imgURLs.get(id);
  let rec = await Store.get("images", id);
  if ((!rec || !rec.blob) && typeof gdFetchImage === "function") rec = await gdFetchImage(id);
  if (!rec || !rec.blob) return null;
  const u = URL.createObjectURL(rec.blob); imgURLs.set(id, u); return u;
}
async function downscale(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  if (sc === 1 && file.size < 1.5e6) return file;
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.86));
}
async function addImages(files) {
  const imgs = [...files].filter(f => f.type.startsWith("image/"));
  if (!imgs.length || !S.current || S.current.deleted) return;
  if (S.mode === "preview") setMode(editModeOf());
  let text = "";
  for (const f of imgs) {
    const id = uid(); let blob = f;
    try { blob = await downscale(f); } catch {}
    await Store.put("images", { id, blob, created: Date.now() });
    text += `\n![${esc((f.name || "image").replace(/\.[^.]+$/, "")).replace(/[\[\]]/g, "")}](attachments/${id}.${extOf(blob.type)})\n`;
  }
  insertAtCursor(text);
  toast(`사진 ${imgs.length}장을 넣었어요`);
}

function descendants(id) { const out = new Set([id]); const walk = p => children(p).forEach(c => { out.add(c.id); walk(c.id); }); walk(id); return out; }

function visibleNotes() {
  const v = S.view, inTrash = v.type === "trash";
  let list = S.notes.filter(n => (inTrash ? n.deleted : !n.deleted));
  if (S.search) {
    const f = parseQuery(S.search), ctx = orphanCtx();
    list = list.filter(n => matchQuery(n, f, ctx));
  } else if (v.type === "smart") {
    const sf = smartById(v.id), f = parseQuery(sf ? sf.query : ""), ctx = orphanCtx();
    list = list.filter(n => matchQuery(n, f, ctx));
  } else if (v.type === "pinned") list = list.filter(n => n.pinned);
  else if (v.type === "unfiled") list = list.filter(n => !n.notebookId || !nbById(n.notebookId));
  else if (v.type === "notebook") { const ids = descendants(v.id); list = list.filter(n => ids.has(n.notebookId)); }
  else if (v.type === "tag") list = list.filter(n => n.tags.some(t => t === v.tag || t.startsWith(v.tag + "/")));
  const key = S.sort;
  list.sort((a, b) => {
    if (!inTrash && a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    if (key === "title") return (a.title || "￿").localeCompare(b.title || "￿", "ko");
    return b[key] - a[key];
  });
  return list;
}
function viewTitle() {

}
function fmtDate(t) {
  const d = new Date(t), now = new Date();
  const same = (a, b) => a.toDateString() === b.toDateString();
  const hm = d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });
  if (same(d, now)) return "오늘 " + hm;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (same(d, y)) return "어제 " + hm;
  return d.getFullYear() === now.getFullYear() ? `${d.getMonth() + 1}월 ${d.getDate()}일` : `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
}

function snippet(n) {
  const p = plain(n.body);
  const term = S.search ? parseQuery(S.search).text[0] : "";
  if (!term) return esc(p.slice(0, 140)) || '<span style="color:var(--faint)">내용 없음</span>';
  const i = p.toLowerCase().indexOf(term);
  if (i < 0) return esc(p.slice(0, 140));
  const s = Math.max(0, i - 30), part = p.slice(s, s + 150);
  const j = i - s, q = term.length;
  return (s ? "…" : "") + esc(part.slice(0, j)) + "<mark>" + esc(part.slice(j, j + q)) + "</mark>" + esc(part.slice(j + q));
}

}

/* ---------- 필터 검색 ---------- */
function parseQuery(q) {
  const f = { text: [], tags: [], nbs: [], has: [], is: [], no: [], before: null, after: null };
  for (let t of (q || "").match(/"[^"]*"|\S+/g) || []) {
    t = t.replace(/^"|"$/g, "");
    const m = t.match(/^(tag|nb|has|is|no|before|after):(.*)$/i);
    if (m) {
      const k = m[1].toLowerCase(), v = m[2].trim(); if (!v) continue;
      if (k === "tag") f.tags.push(keyOf(v.replace(/^#/, "")));
      else if (k === "nb") f.nbs.push(keyOf(v));
      else if (k === "before" || k === "after") { const d = Date.parse(v); if (!isNaN(d)) f[k] = d + (k === "before" ? 0 : 0); }
      else f[k].push(keyOf(v));
    } else if (/^#[^\s#]/.test(t)) f.tags.push(keyOf(t.slice(1)));
    else if (t) f.text.push(keyOf(t));
  }
  return f;
}
function orphanCtx() {
  const inc = new Set();
  for (const o of S.notes) if (!o.deleted) for (const t of o.links || []) { const r = resolve(t); if (r && r !== o) inc.add(r.id); }
  return { orphan: n => !inc.has(n.id) && !(n.links || []).some(t => { const r = resolve(t); return r && r !== n; }) };
}

function matchQuery(n, f, ctx) {

  if (!f.tags.every(t => n.tags.some(x => { x = keyOf(x); return x === t || x.startsWith(t + "/"); }))) return false;
  if (f.nbs.length) { const p = keyOf(n.notebookId && nbById(n.notebookId) ? nbPath(n.notebookId) : ""); if (!f.nbs.every(t => p.includes(t))) return false; }
  for (const x of f.has) {
    if (["image", "사진", "img"].includes(x) && !/\((?:img:|(?:\.\/)?attachments\/)/.test(n.body)) return false;
    if (["todo", "할일"].includes(x) && !TODO_RE.test(n.body)) return false;
    if (["link", "링크"].includes(x) && !(n.links || []).length) return false;
    if (["code", "코드"].includes(x) && !/```/.test(n.body)) return false;
  }
  for (const x of f.is) {
    if (["pinned", "즐겨찾기"].includes(x) && !n.pinned) return false;
    if (["orphan", "고립"].includes(x) && !ctx.orphan(n)) return false;
  }
  for (const x of f.no) {
    if (["tag", "태그"].includes(x) && n.tags.length) return false;
    if (["notebook", "노트북"].includes(x) && n.notebookId && nbById(n.notebookId)) return false;
  }
  if (f.before && !(n.updated < f.before)) return false;
  if (f.after && !(n.updated >= f.after)) return false;
  return true;
}

const folded = new Set();
function setupFolds() {
  const id = S.current ? S.current.id : "v";
  E.pv.querySelectorAll(":scope > h1, :scope > h2, :scope > h3, :scope > h4").forEach((hd, i) => {
    const key = id + ":" + i + ":" + hd.textContent;
    const b = document.createElement("button"); b.className = "fold"; b.innerHTML = I.caret; b.title = "접기 / 펴기"; b.setAttribute("aria-label", "접기");
    hd.prepend(b);
    if (folded.has(key)) hd.classList.add("folded");
    b.onclick = e => { e.stopPropagation(); hd.classList.toggle("folded"); hd.classList.contains("folded") ? folded.add(key) : folded.delete(key); refold(); };
  });
  refold();
}
function refold() {
  let hideLevel = Infinity;
  for (const el of E.pv.children) {
    const m = /^H([1-6])$/.exec(el.tagName);
    if (m) {
      const L = +m[1];
      if (L <= hideLevel) hideLevel = Infinity;
      el.hidden = hideLevel !== Infinity;
      if (!el.hidden && el.classList.contains("folded")) hideLevel = L;
    } else el.hidden = hideLevel !== Infinity;
  }
}
function headingsOf(md) {
  const out = []; let fence = false;
  md.split("\n").forEach((l, i) => {
    if (/^\s*```/.test(l)) { fence = !fence; return; }
    if (fence) return;
    const m = l.match(/^(#{1,6})\s+(.+)/); if (m) out.push({ level: m[1].length, text: m[2].trim(), line: i });
  });
  return out;
}
function showOutline(anchor) {
  const hs = headingsOf(E.ta.value);
  if (!hs.length) return toast("제목(#)이 없어요. /제목 으로 넣어보세요");
  const min = Math.min(...hs.map(h => h.level));
  menu(anchor, hs.map((h, i) => ({ label: "　".repeat(h.level - min) + plain(h.text), fn: () => goHeading(h, i) })));
}
function goHeading(h, idx) {
  const sc = $("#edScroll");
  if (S.mode === "preview" || S.mode === "split") {
    const el = E.pv.querySelectorAll(":scope > h1, :scope > h2, :scope > h3, :scope > h4, :scope > h5, :scope > h6")[idx];
    if (el) { if (el.hidden) { E.pv.querySelectorAll(".folded").forEach(x => x.classList.remove("folded")); folded.clear(); refold(); } el.scrollIntoView({ behavior: "smooth", block: "start" }); }
    return;
  }
  const v = E.ta.value; let pos = 0;
  for (let i = 0; i < h.line; i++) pos = v.indexOf("\n", pos) + 1;
  E.ta.focus({ preventScroll: true }); E.ta.setSelectionRange(pos, pos);
  const { y } = caretXY(E.ta, pos);
  sc.scrollTo({ top: sc.scrollTop + y - sc.getBoundingClientRect().top - 70, behavior: "smooth" });
}

/* ---------- 관련 노트 추천 ---------- */
let relCache = { rev: -1, vecs: null };
function features(n) {
  const f = new Map(), add = (k, w) => f.set(k, (f.get(k) || 0) + w);
  n.tags.forEach(t => { add("#" + t, 3); const top = t.split("/")[0]; if (top !== t) add("#" + top, 1.5); });
  const txt = keyOf(plain(n.title + " " + n.title + " " + n.body).replace(TAG_RE, " "));
  for (const w of txt.split(/[^\p{L}\p{N}]+/u)) {
    if (w.length < 2) continue;
    if (/^\p{Script=Hangul}+$/u.test(w)) for (let i = 0; i < w.length - 1; i++) add(w.slice(i, i + 2), 1);
    else if (w.length >= 3) add(w, 1);
  }
  return f;
}
function relatedOf(cur, k = 5) {
  const live = S.notes.filter(n => !n.deleted && !isTpl(n));
  if (relCache.rev !== REV || !relCache.vecs.has(cur.id)) {
    const vecs = new Map(live.map(n => [n.id, features(n)])), df = new Map();
    vecs.forEach(v => v.forEach((_, t) => df.set(t, (df.get(t) || 0) + 1)));
    const N = live.length;
    vecs.forEach(v => { let s = 0; v.forEach((w, t) => { const x = w * Math.log(1 + N / df.get(t)); v.set(t, x); s += x * x; }); v.norm = Math.sqrt(s) || 1; });
    relCache = { rev: REV, vecs };
  }
  const vc = relCache.vecs.get(cur.id); if (!vc) return [];
  const linked = new Set((cur.links || []).map(t => resolve(t)?.id).filter(Boolean));
  const out = [];
  for (const n of live) {
    if (n === cur || linked.has(n.id) || (n.links || []).some(t => resolve(t) === cur)) continue;
    const v = relCache.vecs.get(n.id); let dot = 0;
    const [a, b] = vc.size < v.size ? [vc, v] : [v, vc];
    a.forEach((w, t) => { const x = b.get(t); if (x) dot += w * x; });
    const s = dot / (vc.norm * v.norm);
    if (s > 0.08) out.push({ n, s, shared: n.tags.filter(t => cur.tags.includes(t)) });
  }
  return out.sort((a, b) => b.s - a.s).slice(0, k);
}
function relatedHTML(cur) {
  const rel = relatedOf(cur);
  return `<h5>관련 노트 추천 <span class="n">${rel.length}</span><span class="rel-why">같은 태그 · 비슷한 단어</span></h5>` + (rel.length
    ? rel.map(x => `<div class="bl-row"><button class="bl-item" data-open="${x.n.id}"><b>${esc(x.n.title || "제목 없음")}</b><span>${x.shared.length ? x.shared.map(t => "#" + esc(t)).join(" ") + " · " : ""}${esc(plain(x.n.body).slice(0, 90))}</span></button>${x.n.title.trim() ? `<button class="chip-btn" data-relink="${x.n.id}">연결</button>` : ""}</div>`).join("")
    : `<div class="bl-empty">내용이 쌓이면 비슷한 노트를 찾아 드려요.</div>`);
}
function linkRelated(id) {

/* ---------- .md 가져오기 ---------- */
async function importFiles(files) {
  let c = 0;
  const nbId = S.view.type === "notebook" ? S.view.id : null;
  for (const f of files) {
    if (!/\.(md|markdown|txt)$/i.test(f.name) && !(f.type || "").startsWith("text/")) continue;
    let text = (await f.text()).replace(/^﻿/, "").replace(/\r\n/g, "\n");
    let title = f.name.replace(/\.(md|markdown|txt)$/i, ""), extra = "";
    const fm = text.match(/^---\n([\s\S]*?)\n---\n?/);
    if (fm) {
      text = text.slice(fm[0].length);
      const tl = fm[1].match(/^tags:\s*\[(.*)\]\s*$/m), tb = fm[1].match(/^tags:\s*\n((?:\s*-\s*.+\n?)+)/m);
      const tags = tl ? tl[1].split(",") : tb ? tb[1].split("\n").map(s => s.replace(/^\s*-\s*/, "")) : [];
      const clean = tags.map(t => t.trim().replace(/^["'#]|["']$/g, "")).filter(Boolean);
      if (clean.length) extra = "\n\n" + clean.map(t => "#" + t.replace(/\s+/g, "_")).join(" ");
    }
    const h1 = text.match(/^\s*#\s+(.+)\n?/);
    if (h1) { title = h1[1].trim(); text = text.slice(h1[0].length).replace(/^\n+/, ""); }
    const t = f.lastModified || Date.now();
    const n = { id: uid(), title, body: text + extra, notebookId: nbId, pinned: false, deleted: false, created: t, updated: t };
    n.tags = tagsOf(n.body); n.links = linksOf(n.body);
    S.notes.push(n); await Store.put("notes", { ...n }); c++;
  }
  REV++; renderAll();
  toast(c ? `노트 ${c}개를 가져왔어요` : "가져올 .md 파일이 없어요");
}

/* ---------- 고르기 창 · 명령 팔레트 ---------- */
function picker({ placeholder, items }) {
  return new Promise(res => {
    const m = $("#modal"); let sel = 0, shown = [];
    m.innerHTML = `<div class="dlg qs"><input class="qs-in" placeholder="${esc(placeholder)}" autocomplete="off"><div class="qs-list"></div>
      <div class="qs-hint"><span><span class="kbd">↑↓</span> 이동</span><span><span class="kbd">Enter</span> 선택</span><span><span class="kbd">Esc</span> 닫기</span></div></div>`;
    m.hidden = false;
    const inp = $(".qs-in", m), box = $(".qs-list", m);
    const draw = () => {
      const q = keyOf(inp.value);
      shown = items.filter(it => !q || keyOf(it.label + " " + (it.kw || "")).includes(q));
      box.innerHTML = shown.map((it, i) => `<button class="qs-item ${i === sel ? "sel" : ""}" data-i="${i}">${it.icon ? `<span class="ic">${it.icon}</span>` : ""}<span>${esc(it.label)}</span>${it.hint ? `<small>${esc(it.hint)}</small>` : ""}</button>`).join("")
        || `<div class="empty" style="padding:24px">찾는 항목이 없어요</div>`;
      box.querySelector(".sel")?.scrollIntoView({ block: "nearest" });
    };
    const done = v => { m.hidden = true; m.innerHTML = ""; m.onclick = m.onkeydown = null; res(v); };
    inp.oninput = () => { sel = 0; draw(); };
    m.onkeydown = e => {
      if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(shown.length - 1, sel + 1); draw(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
      else if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); if (shown[sel]) done(shown[sel]); }
      else if (e.key === "Escape") done(null);
    };
    m.onclick = e => { if (e.target === m) return done(null); const b = e.target.closest("[data-i]"); if (b) done(shown[+b.dataset.i]); };
    draw(); setTimeout(() => inp.focus(), 20);
  });
}

/* =========================================================

   ========================================================= */
const GD = {
  CLIENT_ID: "595411462544-738iqid9aslsh5fqk4bajo3dipg9us08.apps.googleusercontent.com",
  SCOPE: "https://www.googleapis.com/auth/drive.file",

function syncHook(store, obj, isDel) {

    else { obj.dirty = true; const live = S.notes.find(x => x.id === obj.id); if (live) live.dirty = true; }

/* ---- 로그인 ---- */
function gdInitClient() {
  if (GD.tc || !window.google?.accounts?.oauth2) return !!GD.tc;
  GD.tc = google.accounts.oauth2.initTokenClient({
    client_id: GD.CLIENT_ID, scope: GD.SCOPE,
    callback: r => {
      if (r.error) return GD.pending?.reject(r);
      GD.token = r.access_token; GD.exp = Date.now() + (Number(r.expires_in || 3600) - 120) * 1000;
      try { localStorage.setItem("bn.tok", JSON.stringify({ t: GD.token, e: GD.exp })); } catch {}
      GD.pending?.resolve();
    },
    error_callback: e => GD.pending?.reject(e),
  });
  return true;
}
function gdAuth(prompt) {
  return new Promise((resolve, reject) => {
    if (!gdInitClient()) return reject(new Error("구글 로그인 스크립트를 불러오지 못했어요"));
    GD.pending = { resolve, reject };
    GD.tc.requestAccessToken({ prompt, hint: GD.email || undefined });
  });
}
async function gdConnect() {

    await gdAuth(GD.on ? "" : "consent");
    const u = (await gapi("about", { query: { fields: "user(emailAddress,displayName)" } })).user;
    const prev = pref("account", "");
    if (prev && prev !== u.emailAddress) {

      const ok = await dialog({ title: "다른 구글 계정이에요", okText: "새 계정으로 바꾸기", danger: true,
        message: `이 기기의 노트는 ${prev} 계정 것이에요. ${u.emailAddress}(으)로 바꾸면 이 기기의 노트를 비우고 새 계정의 노트를 불러와요.${dirty ? ` 아직 드라이브에 안 올라간 노트 ${dirty}개는 사라져요.` : " 원래 계정의 노트는 그 드라이브에 그대로 있어요."}` });
      if (!ok) { gdDisconnect(true); return; }
      await gdWipeLocal();
    }

    GD.on = true; setPref("gd", "1");

  } catch (e) { console.error(e); setGD(GD.on ? "needauth" : "off"); toast("드라이브 연결을 취소했거나 실패했어요"); }
}
function gdDisconnect(quiet) {
  try { if (GD.token && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(GD.token, () => {}); } catch {}
  GD.token = null; GD.exp = 0; GD.on = false; setPref("gd", ""); try { localStorage.removeItem("bn.tok"); } catch {}
  setGD("off"); if (!quiet) toast("드라이브 연결을 끊었어요. 노트는 이 기기에 남아 있어요");
}
async function gdWipeLocal() {
  for (const st of ["notes", "notebooks", "images", "versions"]) for (const o of await Store.all(st)) await Store.del(st, o.id, true);
  S.notes = []; S.notebooks = []; S.smart = []; setPref("smart", "[]"); S.current = null;
  setPref("gdDel", "[]"); setPref("metaRev", ""); setPref("metaDirty", ""); REV++; renderAll();

/* ---- API ---- */
async function gapi(path, { method = "GET", body, headers = {}, raw = false, query } = {}) {
  if (!GD.token || Date.now() > GD.exp) throw Object.assign(new Error("auth"), { auth: true });
  const qs = query ? "?" + new URLSearchParams(Object.entries(query).filter(([, v]) => v !== undefined && v !== "")) : "";
  const url = (path.startsWith("http") ? path : "https://www.googleapis.com/drive/v3/" + path) + qs;
  const r = await fetch(url, { method, body, headers: { Authorization: "Bearer " + GD.token, ...headers } });
  if (r.status === 401) { GD.token = null; throw Object.assign(new Error("auth"), { auth: true }); }
  if (!r.ok) throw Object.assign(new Error(`드라이브 오류 ${r.status}`), { status: r.status, detail: await r.text().catch(() => "") });
  return raw ? r : r.status === 204 ? null : r.json();
}
async function gdList(q) {
  let out = [], pageToken;
  do {
    const r = await gapi("files", { query: { q, pageSize: 1000, pageToken, fields: "nextPageToken,files(id,name,modifiedTime,appProperties,trashed,mimeType)" } });
    out = out.concat(r.files || []); pageToken = r.nextPageToken;
  } while (pageToken);
  return out;
}
function gdUpload({ id, name, parents, appProperties, mimeType, data, trashed }) {
  const meta = { name, mimeType, appProperties };
  if (!id && parents) meta.parents = parents;
  if (trashed !== undefined) meta.trashed = trashed;
  const b = "bn" + uid();
  const body = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${mimeType}\r\n\r\n`, data, `\r\n--${b}--`]);
  return gapi("https://www.googleapis.com/upload/drive/v3/files" + (id ? "/" + id : ""), {
    method: id ? "PATCH" : "POST", body, query: { uploadType: "multipart", fields: "id,modifiedTime" },
    headers: { "Content-Type": "multipart/related; boundary=" + b },
  });
}
const gdText = async id => (await gapi(`files/${id}`, { query: { alt: "media" }, raw: true })).text();
async function pool(items, n, fn) { let i = 0; await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) await fn(items[i++]); })); }
async function gdFolder(key, name, parent) {
  const q = `appProperties has { key='bn' and value='${key}' } and trashed=false` + (parent ? ` and '${parent}' in parents` : "");
  const f = (await gdList(q))[0];
  if (f) return f.id;
  const r = await gapi("files", { method: "POST", query: { fields: "id" }, headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, mimeType: "application/vnd.google-apps.folder", appProperties: { bn: key }, parents: parent ? [parent] : undefined }) });
  return r.id;
}
async function gdEnsureFolders() {
  if (!GD.root) GD.root = await gdFolder("root", "브레인 노트");
  if (!GD.att) GD.att = await gdFolder("att", "attachments", GD.root);
}

/* ---- 노트 ↔ 파일 ---- */
const utf8len = s => new TextEncoder().encode(s).length;
function fileName(title) {
  const t = (title || "").replace(/[\\/:*?"<>|#^\[\]\n\r\t]/g, " ").replace(/\s+/g, " ").trim().slice(0, 120);
  return (t || "제목 없음") + ".md";
}
function noteProps(n) {
  const ap = { bnId: n.id, bnNb: n.notebookId || "-", bnPin: n.pinned ? "1" : "0", bnCreated: String(n.created || 0), bnUp: String(n.updated || 0) };
  const t = n.title.trim();
  if (t && fileName(t) !== t + ".md" && utf8len("bnT" + t) <= 120) ap.bnT = t;
  return ap;
}
function fieldsFrom(f, body) {
  const a = f.appProperties || {};
  return {
    title: a.bnT || f.name.replace(/\.md$/i, "").replace(/^제목 없음$/, ""), body,
    notebookId: a.bnNb && a.bnNb !== "-" ? a.bnNb : null, pinned: a.bnPin === "1",
    created: +a.bnCreated || Date.parse(f.modifiedTime), updated: +a.bnUp || Date.parse(f.modifiedTime),
    deleted: !!f.trashed, driveId: f.id, driveRev: f.modifiedTime, dirty: false,
  };
}

/* ---- 당겨오기 ---- */
async function gdPull() {
  const files = await gdList(`'${GD.root}' in parents and mimeType != 'application/vnd.google-apps.folder'`);
  const metaF = files.find(f => f.appProperties?.bn === "meta" && !f.trashed);
  if (metaF) { GD.metaId = metaF.id; if (metaF.modifiedTime !== pref("metaRev", "")) await gdPullMeta(metaF); }
  const remote = files.filter(f => f.appProperties?.bnId);
  const seen = new Set(remote.map(f => f.appProperties.bnId));
  const todo = remote.filter(f => { const l = S.notes.find(n => n.id === f.appProperties.bnId); return !l || l.driveRev !== f.modifiedTime; });
  let changed = 0, conflicts = 0, openChanged = false;
  await pool(todo, 6, async f => {
    const body = await gdText(f.id), fl = fieldsFrom(f, body);
    let local = S.notes.find(n => n.id === f.appProperties.bnId);
    const freshWelcome = local && local.id === "welcome" && !local.driveId && local.body === WELCOME;
    const busy = local && !freshWelcome && (local.dirty || (S.current === local && savePending));
    if (local && busy) {
      local.driveId = f.id; local.driveRev = f.modifiedTime;
      if (local.body !== body || local.title !== fl.title) {
        const copy = { ...fl, id: uid(), title: (fl.title || "제목 없음") + " (다른 기기 사본)", driveId: null, driveRev: null, deleted: false };
        copy.tags = tagsOf(body); copy.links = linksOf(body);
        S.notes.push(copy); await Store.put("notes", { ...copy }); conflicts++;
      }
      await Store.put("notes", { ...local, __sync: true });
      return;
    }
    if (local) Object.assign(local, fl); else { local = { id: f.appProperties.bnId, ...fl }; S.notes.push(local); }
    local.tags = tagsOf(body); local.links = linksOf(body);
    await Store.put("notes", { ...local, __sync: true });
    changed++; if (S.current === local) openChanged = true;
  });
  for (const n of [...S.notes]) {
    if (!n.driveId || seen.has(n.id)) continue;
    if (n.dirty) { n.driveId = null; n.driveRev = null; continue; }
    S.notes = S.notes.filter(x => x !== n); await Store.del("notes", n.id, true); changed++;
    if (S.current === n) { S.current = null; openChanged = true; }
  }
  const att = await gdList(`'${GD.att}' in parents and trashed=false`);
  GD.remoteImgs = new Map(att.filter(f => f.appProperties?.bnImg).map(f => [f.appProperties.bnImg, f.id]));
  if (changed || conflicts || metaF) {
    REV++; renderNav(); renderList();
    if (openChanged) renderEditor(); else if (S.current) renderConnections();
  }
  if (conflicts) toast(`다른 기기에서 동시에 고친 노트 ${conflicts}개는 “다른 기기 사본”으로 남겼어요`);
}
async function gdPullMeta(f) {
  let j; try { j = JSON.parse(await gdText(f.id)); } catch { return; }
  const nbs = j.notebooks || [], sm = j.smart || [];
  if (pref("metaDirty", "") === "1") {
    const ids = new Set(S.notebooks.map(b => b.id));
    for (const b of nbs) if (!ids.has(b.id)) { S.notebooks.push(b); await Store.put("notebooks", { ...b, __sync: true }); }
    const sids = new Set(S.smart.map(s => s.id)); sm.forEach(s => { if (!sids.has(s.id)) S.smart.push(s); });
  } else {
    const keep = new Set(nbs.map(b => b.id));
    for (const b of S.notebooks) if (!keep.has(b.id)) await Store.del("notebooks", b.id, true);
    S.notebooks = nbs; for (const b of nbs) await Store.put("notebooks", { ...b, __sync: true });
    S.smart = sm;
  }
  setPref("smart", JSON.stringify(S.smart)); setPref("metaRev", f.modifiedTime); REV++;
}

/* ---- 올리기 ---- */
async function gdPush() {
  const dels = (() => { try { return JSON.parse(pref("gdDel", "[]")); } catch { return []; } })();
  for (const id of dels) {
    try { await gapi(`files/${id}`, { method: "DELETE" }); }
    catch (e) { if (e.auth) throw e; if (e.status !== 404) throw e; }
  }
  if (dels.length) setPref("gdDel", JSON.stringify((JSON.parse(pref("gdDel", "[]"))).filter(x => !dels.includes(x))));
  for (const im of await Store.all("images")) {
    if (im.driveId || !im.blob) continue;
    const r = await gdUpload({ name: `${im.id}.${extOf(im.blob.type)}`, parents: [GD.att], appProperties: { bnImg: im.id }, mimeType: im.blob.type || "image/jpeg", data: im.blob });
    im.driveId = r.id; GD.remoteImgs.set(im.id, r.id); await Store.put("images", { ...im, __sync: true });
  }
  const dirty = S.notes.filter(n => (n.dirty || !n.driveId) && !(n.deleted && !n.driveId));
  await pool(dirty, 4, async n => {
    const snap = n.updated + "\u0000" + n.title + "\u0000" + n.body;
    const r = await gdUpload({ id: n.driveId, name: fileName(n.title), parents: [GD.root], appProperties: noteProps(n), mimeType: "text/markdown", data: n.body, trashed: n.driveId ? !!n.deleted : undefined });
    n.driveId = r.id; n.driveRev = r.modifiedTime;
    if (snap === n.updated + "\u0000" + n.title + "\u0000" + n.body) n.dirty = false;
    await Store.put("notes", { ...n, __sync: true });
  });
  if (pref("metaDirty", "") === "1" || !GD.metaId) {
    const r = await gdUpload({ id: GD.metaId, name: "brainnote.json", parents: [GD.root], appProperties: { bn: "meta" }, mimeType: "application/json",
      data: JSON.stringify({ app: "브레인 노트", notebooks: S.notebooks, smart: S.smart, updated: Date.now() }, null, 1) });
    GD.metaId = r.id; setPref("metaRev", r.modifiedTime); setPref("metaDirty", "");
  }
}
async function gdFetchImage(id) {
  const fid = GD.remoteImgs.get(id);
  if (!fid || !GD.token || Date.now() > GD.exp) return null;
  try {
    const blob = await (await gapi(`files/${fid}`, { query: { alt: "media" }, raw: true })).blob();
    const rec = { id, blob, driveId: fid, created: Date.now() };
    await Store.put("images", { ...rec, __sync: true }); return rec;
  } catch { return null; }
}

/* ---- 동기화 흐름 ---- */
function setGD(st) { GD.state = st; renderDriveNote(); }
async function gdSync() {
  if (!GD.avail || !GD.on) return;
  if (GD.busy) { GD.again = true; return; }
  if (!navigator.onLine) return setGD("offline");
  if (!GD.token || Date.now() > GD.exp) return setGD("needauth");
  GD.busy = true; setGD("syncing");
  try {
    await flushSave();
    await gdEnsureFolders(); await gdPull(); await gdPush();
    GD.last = Date.now(); setPref("gdLast", String(GD.last)); GD.err = ""; setGD("ok");
  } catch (e) {
    console.error(e, e.detail);
    if (e.auth) setGD("needauth");
    else if (!navigator.onLine) setGD("offline");
    else { GD.err = e.message + (e.detail ? " · " + String(e.detail).slice(0, 160) : ""); setGD("error"); }
  } finally {
    GD.busy = false;
    if (GD.again) { GD.again = false; setTimeout(gdSync, 600); }
  }
}
let gdTimer;
function gdSchedule() { if (!GD.avail || !GD.on) return; clearTimeout(gdTimer); gdTimer = setTimeout(gdSync, 3000); if (GD.state === "ok") setGD("pending"); }
function renderDriveNote() {
  const el = $("#storeNote"); if (!el) return;
  const pend = S.notes.filter(n => (n.dirty || !n.driveId) && !(n.deleted && !n.driveId)).length;
  const t = GD.last ? hm(new Date(GD.last)) : "";
  const st = !GD.on ? "off" : GD.state;
  const M = {
    off: ["warn", `이 기기에만 저장 중`, `<button class="chip-btn" id="gdBtn" style="margin-top:6px">구글 드라이브 연결</button>`],
    needauth: ["warn", `드라이브 로그인이 만료됐어요`, `<button class="chip-btn" id="gdBtn" style="margin-top:6px">다시 연결</button>`],
    syncing: ["", `드라이브와 맞추는 중…`, ""],
    pending: ["", `저장됨 · 곧 드라이브에 올라가요`, ""],
    ok: ["", `드라이브 동기화됨${t ? " · " + t : ""}`, ""],
    offline: ["warn", `오프라인 · 연결되면 올라가요${pend ? ` (${pend}개 대기)` : ""}`, ""],
    error: ["warn", `동기화 오류`, `<button class="chip-btn" id="gdBtn" style="margin-top:6px" title="${esc(GD.err)}">다시 시도</button>`],
  }[st] || ["", "", ""];
  el.innerHTML = `<span class="dot ${M[0]}"></span><span>${M[1]}${GD.on && GD.email ? `<br><span style="color:var(--faint)">${esc(GD.email)}</span>` : ""}${M[2] ? "<br>" + M[2] : ""}</span>`;
  const b = $("#gdBtn"); if (b) b.onclick = () => (st === "error" ? gdSync() : gdConnect());
}
function gdStart() {
  if (!GD.avail) return;
  renderDriveNote();
  addEventListener("online", () => gdSync());
  addEventListener("offline", () => GD.on && setGD("offline"));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) gdSync(); });
  setInterval(() => { if (!document.hidden) gdSync(); }, 60000);
  // 로그인이 만료됐으면 다음 클릭 때 조용히 다시 받기 (구글 창이 잠깐 떴다 닫혀요)
  document.addEventListener("pointerdown", e => {
    if (!GD.on || GD.state !== "needauth" || GD.authing || !navigator.onLine || e.target.closest("#gdBtn")) return;
    GD.authing = true;
    gdAuth("").then(() => gdSync()).catch(() => {}).finally(() => { GD.authing = false; });
  }, true);
  if (GD.on) gdSync();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
function driveSettingsHTML() {
  if (!GD.avail) return `<h4>구글 드라이브</h4><div class="note">드라이브 동기화는 앱 주소(GitHub Pages)에서 열었을 때 쓸 수 있어요.</div>`;
  return `<h4>구글 드라이브</h4><div class="opt-row">${GD.on

    <div class="note">${GD.on ? `${esc(GD.email)} · 드라이브의 “브레인 노트” 폴더에 .md 파일로 저장돼요. 이 폴더를 NAS Cloud Sync나 옵시디언으로 열 수 있어요.` : "연결하면 이 기기의 노트가 내 드라이브로 올라가고, 다른 기기와 맞춰져요."}</div>`;

- [ ] #게임/아이디어 처럼 쓰면 태그가 계층으로 정리돼요
- [ ] \`[[노트 제목]]\`처럼 대괄호 두 개로 다른 노트를 연결해요. \`[[\`만 쳐도 목록이 떠요. 없는 노트면 누를 때 새로 생겨요
- [ ] 왼쪽 **그래프 뷰**에서 노트·태그 연결을 한눈에 봐요
- [ ] 줄 처음에 \`/\`를 치면 체크리스트·표·템플릿 같은 넣기 메뉴가 떠요
- [ ] 왼쪽 **오늘 노트**로 날짜별 메모를 바로 열어요

==형광펜==, **굵게**, ~~취소선~~도 위 도구막대로 넣을 수 있어요.

> 사진은 붙여넣기(Ctrl+V)나 끌어다 놓기로 바로 들어가요.

\`\`\`js
// 코드 블록은 언어별로 색이 들어가요

  return \`안녕, \${name}!\`;

## 단축키
| 키 | 기능 |
| --- | --- |
| Ctrl K | 빠른 이동 (노트 제목 검색, 없으면 새로 만들기) |
| Ctrl P | 명령 팔레트 (모든 기능 찾기) |
| Alt N | 새 노트 |
| Ctrl E | 편집 ↔ 보기 |
| \`[[\` | 노트 링크 자동완성 |
| Ctrl + 클릭 | 편집 화면에서 링크 열기 |
| Ctrl B / Ctrl I | 굵게 / 기울임 |
| Ctrl Shift F | 집중 모드 |

검색창에서는 \`tag:게임 has:todo\`처럼 조건으로 찾을 수 있고, 그 검색을 스마트 폴더로 저장할 수 있어요.
`;

/* ---------- 시작 ---------- */
async function init() {
  renderTheme(); applyLook();
  await Store.open();
  S.notes = (await Store.all("notes")).map(n => ({ ...n, title: n.title || "", body: n.body || "", tags: tagsOf(n.body || ""), links: linksOf(n.body || "") }));
  S.notebooks = await Store.all("notebooks");
  if (!S.notes.length && pref("welcomed", "") !== "1") {
    const now = Date.now();
    const n = { id: "welcome", title: "👋 시작하기", body: WELCOME, notebookId: null, pinned: true, deleted: false, created: now, updated: now };
    n.tags = tagsOf(n.body); n.links = linksOf(n.body); S.notes.push(n); await Store.put("notes", { ...n }); setPref("welcomed", "1");
  }
  if (innerWidth > 720) S.current = visibleNotes()[0] || null;
  renderStoreNote(); renderAll();
  bindGlobal();
  gdStart();
}
function bindGlobal() {
  $("#newBtn").onclick = () => newNote();
  $("#listNewBtn").onclick = () => newNote();
  $("#fab").onclick = () => newNote();
  $("#viewBtn").onclick = () => { S.listView = S.listView === "grid" ? "list" : "grid"; setPref("listView", S.listView); renderList(); };
  $("#setBtn").onclick = () => { closeDrawer(); showSettings(); };
  $("#mdIn").onchange = e => { importFiles([...e.target.files]); e.target.value = ""; };
  $("#listCount").onclick = e => { if (e.target.closest("#saveSmart")) addSmart(S.search); };
  $("#menuBtn").onclick = openDrawer;
  $("#gMenuBtn").onclick = openDrawer;
  bindGraphPane();
  $("#scrim").onclick = closeDrawer;
  $("#qsBtn").onclick = () => { closeDrawer(); quickSwitch(); };
  $("#themeBtn").onclick = () => { S.theme = { system: "light", light: "dark", dark: "system" }[S.theme]; setPref("theme", S.theme); renderTheme(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", renderTheme);
  $("#sortSel").onchange = e => { S.sort = e.target.value; setPref("sort", S.sort); renderList(); };
  let st; $("#searchIn").oninput = e => { clearTimeout(st); st = setTimeout(() => { S.search = e.target.value.trim(); renderNav(); renderList(); setPane("list"); }, 120); };
  $("#searchIn").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) closeDrawer(); };
  $("#notes").onclick = e => { const c = e.target.closest(".card"); if (c) openNote(c.dataset.id); };
  $("#trashBar").onclick = async e => {
    if (!e.target.closest("#emptyTrash")) return;
    const t = S.notes.filter(n => n.deleted);
    if (!(await dialog({ title: "휴지통 비우기", message: `노트 ${t.length}개를 완전히 지워요. 되돌릴 수 없어요.`, okText: "모두 삭제", danger: true }))) return;
    for (const n of t) await removeForever(n);
    if (S.current && S.current.deleted) S.current = null;
    renderAll();
  };
  $("#nav").onclick = e => {
    if (e.target.closest("#addNbBtn")) return addNotebook();
    if (e.target.closest("#addSmartBtn")) return addSmart("");
    const caret = e.target.closest("[data-caret]");
    if (caret && !caret.classList.contains("nokids")) { const k = caret.dataset.caret; S.open.has(k) ? S.open.delete(k) : S.open.add(k); saveOpen(); return renderNav(); }
    const more = e.target.closest("[data-more]");
    if (more) return more.dataset.more.startsWith("smart:") ? smartMenu(more, more.dataset.more.slice(6)) : notebookMenu(more, more.dataset.more.slice(3));
    const it = e.target.closest(".nav-item"); if (!it) return;
    const k = it.dataset.key;
    if (k === "addnb") return addNotebook();
    if (k === "graph") return enterGraph();
    if (k === "daily") return openDaily();
    if (k.startsWith("smart:")) return go({ type: "smart", id: k.slice(6) });
    if (k.startsWith("nb:")) go({ type: "notebook", id: k.slice(3) });
    else if (k.startsWith("tag:")) go({ type: "tag", tag: k.slice(4) });
    else go({ type: k });
  };
  $("#nav").onkeydown = e => { if (e.key === "Enter" && e.target.classList.contains("nav-item")) e.target.click(); };
  $("#fileIn").onchange = e => { addImages(e.target.files); e.target.value = ""; };

  // 끌어다 놓기
  let dragN = 0, hint;
  addEventListener("dragenter", e => { if (![...e.dataTransfer.types].includes("Files")) return; dragN++; if (!hint) { hint = document.createElement("div"); hint.className = "drop-hint"; hint.textContent = "사진은 노트에 넣고, .md 파일은 노트로 가져와요"; document.body.appendChild(hint); } });
  addEventListener("dragleave", () => { if (--dragN <= 0) { dragN = 0; hint?.remove(); hint = null; } });
  addEventListener("dragover", e => { if (hint) e.preventDefault(); });
  addEventListener("drop", e => {
    if (!hint) return; e.preventDefault(); dragN = 0; hint.remove(); hint = null;
    const fs = [...e.dataTransfer.files], md = fs.filter(f => /\.(md|markdown|txt)$/i.test(f.name));
    if (md.length) importFiles(md);
    if (fs.some(f => f.type.startsWith("image/"))) addImages(fs);
  });

  // 단축키
  addEventListener("keydown", e => {
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (!$("#modal").hidden) return;
    if ((mod && (k === "k" || k === "o")) ) { e.preventDefault(); quickSwitch(); }
    else if (mod && k === "p") { e.preventDefault(); commandPalette(); }
    else if ((mod && e.shiftKey && k === "f") || (mod && e.key === "\\")) { e.preventDefault(); toggleFocus(); }
    else if (e.altKey && k === "n") { e.preventDefault(); newNote(); }
    else if (mod && k === "e" && S.current && !S.current.deleted) { e.preventDefault(); setMode(S.mode !== "preview" ? "preview" : editModeOf()); if (S.mode !== "preview") E.ta.focus(); }
    else if (mod && k === "s") { e.preventDefault(); flushSave(); }
    else if (e.key === "Escape") { if (AC.open) acClose(); else if (S.graphMode && $("#app").classList.contains("drawer") === false) exitGraph(); closeDrawer(); }
  });
  addEventListener("resize", () => { if (S.mode === "split" && innerWidth <= 1100) setMode("edit", true); autoGrow(); });
  addEventListener("beforeunload", () => { flushSave(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) flushSave(); });
}
init();
</script>
